<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PROJECT 2036 — THE LIFE BLUEPRINT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#eef2f9;--card:rgba(255,255,255,.78);--bd:rgba(70,90,130,.25);--tx:#0f172a;--mu:#5b6678;--c1:#0891b2;--c2:#6d28d9;--in:rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#05060a;--card:rgba(20,24,36,.62);--bd:rgba(120,160,220,.22);--tx:#e8eefc;--mu:#8b97ad;--c1:#22d3ee;--c2:#a78bfa;--in:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#05060a;--card:rgba(20,24,36,.62);--bd:rgba(120,160,220,.22);--tx:#e8eefc;--mu:#8b97ad;--c1:#22d3ee;--c2:#a78bfa;--in:rgba(255,255,255,.06)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;background-image:linear-gradient(var(--in) 1px,transparent 1px),linear-gradient(90deg,var(--in) 1px,transparent 1px);background-size:44px 44px}
#pc{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;display:flex;min-height:100vh}
#side{width:230px;padding:18px 12px;border-right:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:.25s}
.sb #side{width:64px}.sb .lb{display:none}
#side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:3px 0;padding:10px 12px}
#main{flex:1;padding:22px;min-width:0;max-width:1200px;margin:auto}
h1,h2,h3{font-family:"Orbitron","Segoe UI",sans-serif;letter-spacing:.06em;margin:.2em 0}h1{font-size:clamp(20px,4vw,30px);background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer;letter-spacing:.04em;font-size:12px;transition:.2s}
button:hover{box-shadow:0 0 14px var(--c1);border-color:var(--c1)}button.pri{background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;border:0}button.dng:hover{box-shadow:0 0 14px #f43f5e;border-color:#f43f5e}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 14px;border-top:2px solid var(--a,var(--c1))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.grid .card{margin:0}
.stat b{font-size:28px;display:block;color:var(--c1)}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--in);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 10px var(--c1);transition:width .5s}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill,.tag{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--bd)}.Completed{color:#4ade80}.InProgress{color:var(--c1)}.OnHold{color:#fbbf24}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px}label{display:block;font-size:12px;color:var(--mu);margin:8px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
#m{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px}#m[hidden]{display:none}
#m>div{background:var(--bg);border:1px solid var(--c1);border-radius:18px;padding:20px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 0 40px rgba(34,211,238,.25)}
.err{color:#f43f5e;font-size:13px}#t{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--c1);color:#001;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}#t.on{opacity:1}
.tl{border-left:2px solid var(--c1);padding-left:16px;margin-left:6px}details{margin-bottom:12px}summary{cursor:pointer;list-style:none}
.cols{display:flex;gap:6px;align-items:flex-end;height:110px}.cols div{flex:1;text-align:center;font-size:10px}.cols i{display:block;background:linear-gradient(var(--c2),var(--c1));border-radius:6px 6px 0 0;min-height:2px}
.badge{opacity:.35;filter:grayscale(1)}.badge.on{opacity:1;filter:none;box-shadow:0 0 18px var(--c2)}
.cf{position:fixed;top:-20px;z-index:70;animation:fall 1.8s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
@media(max-width:700px){#side{position:fixed;bottom:0;top:auto;height:auto;width:100%;display:flex;overflow-x:auto;z-index:20;border-top:1px solid var(--bd);border-right:0;padding:6px}#side button{width:auto;flex:none}.lb{display:none}#main{padding:14px 12px 90px}.sb #side{width:100%}}
@media print{#side,.btns,#pc,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999}}
</style></head><body>
<canvas id="pc"></canvas><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
<div id="app"><aside id="side"></aside><main id="main"></main></div><div id="m" hidden></div><div id="t"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),D=new Date(),Y=D.getFullYear();
const CATS=[["trade","Trading & Financial Skills","📈","#22d3ee"],["biz","Business & Entrepreneurship","🚀","#a78bfa"],["wealth","Wealth & Investments","💎","#60a5fa"],["re","Real Estate & Property","🏢","#34d399"],["cars","Cars & Luxury Collection","🏎️","#f472b6"],["house","Dream House & Lifestyle","🏡","#fbbf24"],["tech","Technology & AI Skills","🤖","#38bdf8"],["edu","Education & Personal Development","📚","#c084fc"],["health","Health & Fitness","💪","#4ade80"],["travel","Travel & Experiences","✈️","#fb923c"],["fam","Family & Relationships","❤️","#f87171"],["other","Other Personal Goals","⭐","#94a3b8"]];
const TH=["Foundation","Discipline","Skill Mastery","Growth","Financial Progress","Expansion","Wealth Building","Asset Accumulation","Freedom","Legacy","The Vision"];
const def=()=>({title:"PROJECT 2036 — THE LIFE BLUEPRINT",vision:"",theme:"dark",cur:"INR",sy:2026,ey:2036,cats:CATS.map(([id,name,icon,color])=>({id,name,icon,color})),ym:{},goals:[],fin:[],reviews:[]});
let S,saveOk=true,V="dash",SB=false,OP=new Set(),F={q:"",y:"",c:"",s:"",p:"",o:"updated"},pend=null,cur=null;
try{S={...def(),...JSON.parse(localStorage.getItem("p2036"))}}catch(e){S=def()}
const save=()=>{try{localStorage.setItem("p2036",JSON.stringify(S));saveOk=true}catch(e){saveOk=false;toast("⚠ Could not save to browser storage — export a backup!")}};
const toast=m=>{const t=$("#t");t.textContent=m;t.className="on";clearTimeout(t.h);t.h=setTimeout(()=>t.className="",2600)};
const cat=id=>S.cats.find(c=>c.id===id)||{name:"Uncategorized",icon:"•",color:"#94a3b8"};
const money=(n,c=S.cur)=>{try{return new Intl.NumberFormat(c==="INR"?"en-IN":"en-US",{style:"currency",currency:c,maximumFractionDigits:0}).format(n||0)}catch(e){return c+" "+n}};
const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0,G=()=>S.goals,PR={Critical:0,High:1,Medium:2,Low:3};
const ys=()=>{const a=[];for(let y=S.sy;y<=S.ey;y++)a.push(y);return a};
const ym=y=>({theme:TH[y-2026]||"Your Theme",notes:"",prio:"Medium",target:"",...(S.ym[y]||{})});
const bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`;
const ring=(p,z=96)=>`<svg width=${z} height=${z} viewBox="0 0 36 36"><circle cx=18 cy=18 r=15.9 fill=none stroke="var(--bd)" stroke-width=3 /><circle cx=18 cy=18 r=15.9 fill=none stroke="url(#g)" stroke-width=3 stroke-dasharray="${p} 100" stroke-linecap=round transform="rotate(-90 18 18)"/><text x=18 y=20.5 text-anchor=middle font-size=8 fill="var(--tx)">${p}%</text></svg>`;
const gy=y=>avg(G().filter(g=>g.year===y).map(g=>g.progress));
const msd=g=>g.ms.filter(m=>m.d).length;
const sel=(n,o,v)=>`<select name=${n}>${o.map(x=>{const[a,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}"${a==v?" selected":""}>${esc(l)}</option>`}).join("")}</select>`;
const empty=(t,b="")=>`<div class=card style="text-align:center"><p class=mu>${t}</p>${b}</div>`;
const addBtn=y=>`<button class=pri data-a=add ${y?`data-y=${y}`:""}>+ ADD NEW GOAL</button>`;
function openM(h){const m=$("#m");m.innerHTML=`<div>${h}</div>`;m.hidden=false}
function closeM(){$("#m").hidden=true;cur=null}
function ask(msg,fn,yes="CONFIRM"){pend=fn;openM(`<h3>${esc(msg)}</h3><div class=btns><button class="pri" data-a=yes>${yes}</button><button data-a=close>CANCEL</button></div>`)}
function fx(){for(let i=0;i<30;i++){const s=document.createElement("span");s.className="cf";s.textContent=["✨","🎉","💠","⭐"][i%4];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
function dl(name,txt,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ---------- views ---------- */
const NAV=[["dash","🛰️","Dashboard"],["time","🗓️","Timeline"],["goals","🎯","Goals"],["fin","💰","Finance"],["ach","🏆","Achievements"],["rev","📝","Reviews"],["set","⚙️","Settings"]];
function card(g){const c=cat(g.cat),cl=g.status==="Completed";return`<div class=card style="--a:${c.color}"><div class=row><span class=tag>${c.icon} ${esc(c.name)}</span><span class="pill ${g.status.replace(/ /g,"")}">${g.status}</span></div><h3>${esc(g.title)}</h3><div class=mu>${g.year} · ${g.priority}${g.target?" · Due "+g.target:""}</div>${bar(g.progress)}<div class=mu>${g.progress}% · ${msd(g)}/${g.ms.length} milestones</div><div class=btns><button data-a=view data-id=${g.id}>VIEW</button><button data-a=edit data-id=${g.id}>EDIT</button><button data-a=prog data-id=${g.id}>UPDATE PROGRESS</button>${cl?"":`<button data-a=done data-id=${g.id}>MARK COMPLETED</button>`}<button class=dng data-a=del data-id=${g.id}>DELETE</button></div></div>`}
function dash(){const g=G(),done=g.filter(x=>x.status==="Completed"),open=g.filter(x=>x.status!=="Completed"),md=g.reduce((s,x)=>s+msd(x),0);
const days=Math.max(0,Math.ceil((new Date(S.ey,11,31)-D)/864e5)),all=avg(g.map(x=>x.progress));
const nm=open.filter(x=>x.ms.some(m=>!m.d)).sort((a,b)=>(a.target||"9")>(b.target||"9")?1:-1)[0];
const nx=[...open].sort((a,b)=>(a.status==="In Progress"?0:1)-(b.status==="In Progress"?0:1)||PR[a.priority]-PR[b.priority])[0];
const st=(n,l)=>`<div class="card stat"><b>${n}</b><span class=mu>${l}</span></div>`;
return`<div class=top><div><h1>${esc(S.title)}</h1><div class=mu>WAIT AND WIN. BUILD YOUR LEGACY.</div></div>${addBtn()}</div>
<div class=card><h2>YOUR FUTURE IS UNDER CONSTRUCTION.</h2><div class=mu>${D.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})} · ${Y}</div>${S.vision?`<p>“${esc(S.vision)}”</p>`:""}</div>
<div class=grid style="margin-bottom:14px">${st(g.length,"Total goals")}${st(done.length,"Completed")}${st(g.filter(x=>x.status==="In Progress").length,"In progress")}${st(g.filter(x=>x.status==="Not Started").length,"Not started")}${st(md,"Milestones achieved")}${st(days.toLocaleString(),"Days until end of "+S.ey)}</div>
<div class=grid style="margin-bottom:14px"><div class="card row"><div><b>Overall</b><div class=mu>All goals</div></div>${ring(all)}</div><div class="card row"><div><b>${Y}</b><div class=mu>Current year</div></div>${ring(gy(Y))}</div><div class="card row"><div><b>Vision</b><div class=mu>Final 3 years</div></div>${ring(avg(g.filter(x=>x.year>=S.ey-2).map(x=>x.progress)))}</div></div>
<div class=card><h3>ANNUAL PROGRESS</h3><div class=cols>${ys().map(y=>`<div><i style="height:${gy(y)}px"></i>${String(y).slice(2)}</div>`).join("")}</div></div>
<div class=grid><div class=card><h3>NEXT MILESTONE</h3>${nm?`<b>${esc(nm.ms.find(m=>!m.d).t)}</b><div class=mu>${esc(nm.title)}${nm.target?" · due "+nm.target:""}</div>`:`<p class=mu>No open milestones. Add some to a goal.</p>`}</div>
<div class=card><h3>RECENT ACHIEVEMENTS</h3>${done.length?[...done].sort((a,b)=>(b.completed||"")>(a.completed||"")?1:-1).slice(0,3).map(x=>`<div>🏆 ${esc(x.title)} <span class=mu>${x.completed||""}</span></div>`).join(""):`<p class=mu>Nothing completed yet. Real wins only.</p>`}</div>
<div class=card><h3>YOUR NEXT MOVE</h3>${nx?`<b>${esc(nx.ms.find(m=>!m.d)?.t||nx.title)}</b><div class=mu>${esc(nx.title)} · ${nx.priority}</div>`:`<p class=mu>Add your first goal to get a next move.</p>`}</div></div>
${g.length?"":empty("No goals yet. Start building your blueprint.",addBtn())}`}
function time(){return`<div class=top><h1>10-YEAR TIMELINE</h1><div class="btns noprint">${addBtn()}<button onclick="print()">PRINT REPORT</button></div></div><div class=tl>${ys().map(y=>{const m=ym(y),gs=G().filter(g=>g.year===y),p=gy(y);return`<details data-y=${y}${OP.has(y)?" open":""}><summary class=card><div class=row><h2>${y} — ${esc(m.theme.toUpperCase())}</h2><span>${p}% · ${gs.filter(g=>g.status==="Completed").length}/${gs.length} done</span></div>${bar(p)}</summary>
<div class=mu>Priority: ${m.prio}${m.target?" · Target: "+m.target:""}</div>${m.notes?`<p>${esc(m.notes)}</p>`:""}<div class=btns><button class=pri data-a=add data-y=${y}>+ ADD GOAL</button><button data-a=yp data-y=${y}>EDIT YEARLY PLAN</button></div><br>${gs.length?gs.map(card).join(""):empty("No goals for "+y+" yet.")}</details>`}).join("")}</div>`}
function goalList(){let a=G().filter(g=>(!F.y||g.year==F.y)&&(!F.c||g.cat===F.c)&&(!F.s||g.status===F.s)&&(!F.p||g.priority===F.p)&&(g.title+g.desc+g.notes).toLowerCase().includes(F.q.toLowerCase()));
const o={updated:(x,y)=>(y.updated||"")>(x.updated||"")?1:-1,year:(x,y)=>x.year-y.year,priority:(x,y)=>PR[x.priority]-PR[y.priority],progress:(x,y)=>y.progress-x.progress,title:(x,y)=>x.title.localeCompare(y.title)};
a.sort(o[F.o]);return a.length?`<div class=grid>${a.map(card).join("")}</div>`:empty(G().length?"No goals match your filters.":"No goals yet. Create your first one.",G().length?"":addBtn())}
function goals(){const f=(k,l,o)=>`<select data-fl=${k}><option value="">${l}</option>${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}"${F[k]==a?" selected":""}>${esc(b)}</option>`}).join("")}</select>`;
return`<div class=top><h1>GOAL LIBRARY</h1>${addBtn()}</div><div class=filters><input data-fl=q placeholder="Search goals…" value="${esc(F.q)}">${f("y","All years",ys())}${f("c","All categories",S.cats.map(c=>[c.id,c.name]))}${f("s","All statuses",["Not Started","In Progress","Completed","On Hold"])}${f("p","All priorities",["Low","Medium","High","Critical"])}<select data-fl=o>${[["updated","Recently updated"],["year","Year"],["priority","Priority"],["progress","Progress"],["title","Title"]].map(([a,b])=>`<option value=${a}${F.o===a?" selected":""}>Sort: ${b}</option>`).join("")}</select></div><div id=gl>${goalList()}</div>`}
const fsaved=f=>(+f.base||0)+f.tx.reduce((s,t)=>s+t.amt,0);
function fin(){return`<div class=top><h1>FINANCIAL GOALS</h1><button class=pri data-a=fadd>+ ADD FINANCIAL GOAL</button></div><p class=mu>Tracks only what you enter. No trading returns or future wealth are assumed.</p>${S.fin.length?`<div class=grid>${S.fin.map(f=>{const s=fsaved(f),p=f.target>0?Math.min(100,Math.round(s/f.target*100)):0,mo=f.tx.filter(t=>t.date.slice(0,7)===today().slice(0,7)).reduce((a,t)=>a+t.amt,0);return`<div class=card><div class=row><h3>${esc(f.title)}</h3><span class=pill>${f.done?"✅ Achieved "+f.done:"Target "+f.year}</span></div>${bar(p)}<div>${money(s,f.cur)} of ${money(f.target,f.cur)} · ${p}%</div><div class=mu>Remaining ${money(Math.max(0,f.target-s),f.cur)} · This month ${money(mo,f.cur)}</div>${f.notes?`<p class=mu>${esc(f.notes)}</p>`:""}<div class=mu>${f.tx.slice(-3).reverse().map(t=>`${t.date}: ${money(t.amt,f.cur)} ${esc(t.note)}`).join("<br>")}</div><div class=btns><button data-a=ftx data-id=${f.id}>+ TRANSACTION</button><button data-a=fedit data-id=${f.id}>EDIT</button>${!f.done&&s>=f.target&&f.target>0?`<button class=pri data-a=fdone data-id=${f.id}>CONFIRM ACHIEVED</button>`:""}<button class=dng data-a=fdel data-id=${f.id}>DELETE</button></div></div>`}).join("")}</div>`:empty("No financial goals yet. Add one, e.g. an emergency fund.")}`}
const BADGES=()=>{const d=G().filter(g=>g.status==="Completed").length+S.fin.filter(f=>f.done).length,m=G().reduce((s,g)=>s+msd(g),0);return[["🥾","First Step","Complete your first goal",d>=1],["🔁","Consistency Master","Save 4 reviews",S.reviews.length>=4],["🎯","Milestone Hunter","Complete 10 milestones",m>=10],["💥","Goal Crusher","Complete 5 goals",d>=5],["🔭","Vision Builder","Plan goals across 5 different years",new Set(G().map(g=>g.year)).size>=5],["👑","Legacy Creator","Complete 10 goals",d>=10]]};
function ach(){const h=[...G().filter(g=>g.status==="Completed").map(g=>({t:g.title,c:cat(g.cat).name,d:g.completed||"",x:g.desc})),...S.fin.filter(f=>f.done).map(f=>({t:f.title,c:"Financial",d:f.done,x:"Financial goal confirmed by you"}))].sort((a,b)=>b.d>a.d?1:-1);
return`<div class=top><h1>ACHIEVEMENT WALL</h1></div><div class=grid style="margin-bottom:14px">${BADGES().map(b=>`<div class="card badge ${b[3]?"on":""}"><h2>${b[0]} ${b[1]}</h2><div class=mu>${b[2]}${b[3]?" — unlocked":""}</div></div>`).join("")}</div><h3>HISTORY</h3>${h.length?h.map(x=>`<div class=card><b>🏆 ${esc(x.t)}</b><div class=mu>${esc(x.c)} · ${x.d}</div>${x.x?`<p>${esc(x.x)}</p>`:""}</div>`).join(""):empty("No achievements yet. They appear only when you complete real goals.")}`}
const RF=[["done","What I accomplished"],["learn","What I learned"],["wrong","What went wrong"],["improve","What I need to improve"],["win","Biggest win"],["next","Next priorities"],["adjust","Goals that need adjustment"]];
function rev(){return`<div class=top><h1>REVIEWS</h1><div class=btns><button class=pri data-a=radd data-k=Weekly>+ WEEKLY REVIEW</button><button class=pri data-a=radd data-k=Monthly>+ MONTHLY REVIEW</button></div></div>${S.reviews.length?[...S.reviews].sort((a,b)=>b.date>a.date?1:-1).map(r=>`<div class=card><div class=row><h3>${r.kind} · ${r.date}</h3><div class=btns><button data-a=redit data-id=${r.id}>EDIT</button><button class=dng data-a=rdel data-id=${r.id}>DELETE</button></div></div>${RF.filter(f=>r[f[0]]).map(f=>`<div><span class=mu>${f[1]}:</span> ${esc(r[f[0]])}</div>`).join("")}</div>`).join(""):empty("No reviews yet. Reflect weekly, adjust monthly.")}`}
function set(){const gs=G().length;return`<div class=top><h1>SETTINGS</h1></div><div class=card><b>${saveOk?"💾 Saved locally in this browser only.":"⚠ Browser storage unavailable."}</b><p class=mu>No cloud sync is configured. Clearing browser data erases it, so export backups regularly. Cloud sync (e.g. Supabase) can be added later by hosting this as a full project.</p></div>
<form data-f=set class=card><label>Website title<input name=title value="${esc(S.title)}"></label><label>Vision statement<textarea name=vision rows=3>${esc(S.vision)}</textarea></label><div class=g2><label>Theme${sel("theme",["dark","light"],S.theme)}</label><label>Currency${sel("cur",["INR","USD","EUR","GBP","AED"],S.cur)}</label><label>Start year<input type=number name=sy value=${S.sy}></label><label>End year<input type=number name=ey value=${S.ey}></label></div><div id=err class=err></div><button class=pri>SAVE SETTINGS</button></form>
<div class=card><h3>CATEGORIES</h3>${S.cats.map(c=>`<div class=row style="margin:4px 0"><span style="color:${c.color}">${c.icon} ${esc(c.name)}</span><div class=btns style="margin:0"><button data-a=cedit data-id=${c.id}>EDIT</button><button class=dng data-a=cdel data-id=${c.id}>DELETE</button></div></div>`).join("")}<div class=btns><button data-a=cadd>+ ADD CATEGORY</button></div></div>
<div class=card><h3>BACKUP</h3><div class=btns><button data-a=ejson>EXPORT JSON</button><button data-a=ecsv>EXPORT GOALS CSV</button><button data-a=imp>IMPORT JSON</button><button class=dng data-a=clear>CLEAR ALL DATA</button></div><input type=file id=fi accept=".json" hidden><p class=mu>${gs} goals · ${S.fin.length} financial goals · ${S.reviews.length} reviews stored.</p></div>`}
const VIEWS={dash,time,goals,fin,ach,rev,set};
function render(){document.documentElement.dataset.theme=S.theme;document.title=S.title;$("#app").className=SB?"sb":"";
$("#side").innerHTML=`<button data-a=sb>☰ <span class=lb>COLLAPSE</span></button>`+NAV.map(n=>`<button data-a=nav data-v=${n[0]} style="${V===n[0]?"border-color:var(--c1);box-shadow:0 0 12px var(--c1)":""}">${n[1]} <span class=lb>${n[2]}</span></button>`).join("");
$("#main").innerHTML=VIEWS[V]()}

/* ---------- forms ---------- */
function goalForm(id,y){const g=id?G().find(x=>x.id===id):{title:"",desc:"",cat:S.cats[0]?.id,year:y?+y:Math.min(Math.max(Y,S.sy),S.ey),start:today(),target:"",priority:"Medium",status:"Not Started",progress:0,budget:"",spent:"",notes:""};
openM(`<form data-f=goal data-id="${id||""}"><h2>${id?"EDIT":"NEW"} GOAL</h2><div id=err class=err></div><label>Title *<input name=title value="${esc(g.title)}" maxlength=120></label><label>Description<textarea name=desc rows=3>${esc(g.desc)}</textarea></label><div class=g2><label>Category${sel("cat",S.cats.map(c=>[c.id,c.icon+" "+c.name]),g.cat)}</label><label>Target year${sel("year",[...new Set([...ys(),g.year])].sort(),g.year)}</label><label>Start date<input type=date name=start value="${g.start||""}"></label><label>Target date<input type=date name=target value="${g.target||""}"></label><label>Priority${sel("priority",["Low","Medium","High","Critical"],g.priority)}</label><label>Status${sel("status",["Not Started","In Progress","Completed","On Hold"],g.status)}</label><label>Progress %<input type=number name=progress min=0 max=100 value=${g.progress}></label><label>Estimated budget<input type=number name=budget min=0 value="${g.budget}"></label><label>Actual spent<input type=number name=spent min=0 value="${g.spent}"></label></div><label>Notes<textarea name=notes rows=2>${esc(g.notes)}</textarea></label><div class=btns><button class=pri>SAVE GOAL</button><button type=button data-a=close>CANCEL</button></div></form>`)}
function viewGoal(id){const g=G().find(x=>x.id===id);if(!g)return closeM();cur=id;const c=cat(g.cat),p=g.ms.length?Math.round(msd(g)/g.ms.length*100):0;
openM(`<h2>${c.icon} ${esc(g.title)}</h2><div class=mu>${esc(c.name)} · ${g.year} · ${g.priority} · ${g.status} · ${g.progress}%</div><p>${esc(g.desc)||"<span class=mu>No description.</span>"}</p><div class=mu>Start ${g.start||"–"} · Target ${g.target||"–"} · Created ${g.created} · Updated ${g.updated}${g.completed?" · Completed "+g.completed:""}</div><div class=mu>Budget ${g.budget?money(g.budget):"–"} · Spent ${g.spent?money(g.spent):"–"}</div>${g.notes?`<p>📝 ${esc(g.notes)}</p>`:""}
<h3>MILESTONES (${p}%)</h3>${bar(p)}${g.ms.length?g.ms.map((m,i)=>`<div class=row style="margin:6px 0"><label style="margin:0;color:var(--tx)"><input type=checkbox style="width:auto" data-a=mstog data-i=${i}${m.d?" checked":""}> ${m.d?"<s>":""}${esc(m.t)}${m.d?"</s>":""}${m.n?` <span class=mu>— ${esc(m.n)}</span>`:""}</label><div class=btns style="margin:0"><button data-a=msup data-i=${i}>↑</button><button data-a=msdn data-i=${i}>↓</button><button data-a=msed data-i=${i}>✎</button><button data-a=msnt data-i=${i}>📝</button><button class=dng data-a=msdel data-i=${i}>✕</button></div></div>`).join(""):`<p class=mu>No milestones yet.</p>`}
<div class=row><input id=nm placeholder="New milestone…" style="flex:1"><button class=pri data-a=msadd>ADD</button></div><div class=btns><button data-a=edit data-id=${g.id}>EDIT</button><button data-a=close>CLOSE</button></div>`)}
function finForm(id){const f=id?S.fin.find(x=>x.id===id):{title:"",target:"",base:0,cur:S.cur,year:Y,notes:""};openM(`<form data-f=fin data-id="${id||""}"><h2>FINANCIAL GOAL</h2><div id=err class=err></div><label>Title *<input name=title value="${esc(f.title)}"></label><div class=g2><label>Target amount *<input type=number name=target min=0 value="${f.target}"></label><label>Starting saved amount<input type=number name=base value="${f.base}"></label><label>Currency${sel("cur",["INR","USD","EUR","GBP","AED"],f.cur)}</label><label>Target year<input type=number name=year value=${f.year}></label></div><label>Notes / milestones<textarea name=notes rows=3>${esc(f.notes)}</textarea></label><div class=btns><button class=pri>SAVE</button><button type=button data-a=close>CANCEL</button></div></form>`)}
function revForm(id,k){const r=id?S.reviews.find(x=>x.id===id):{kind:k,date:today()};openM(`<form data-f=rev data-id="${id||""}"><h2>${r.kind} REVIEW</h2><input type=hidden name=kind value=${r.kind}><label>Date<input type=date name=date value="${r.date}"></label>${RF.map(f=>`<label>${f[1]}<textarea name=${f[0]} rows=2>${esc(r[f[0]]||"")}</textarea></label>`).join("")}<div class=btns><button class=pri>SAVE REVIEW</button><button type=button data-a=close>CANCEL</button></div></form>`)}

/* ---------- events ---------- */
const gg=()=>G().find(x=>x.id===cur);
const upd=(g)=>{g.updated=today();save();render()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,i=+b.dataset.i,g=id&&G().find(x=>x.id===id);
if(a==="nav"){V=b.dataset.v;render();scrollTo(0,0)}else if(a==="sb"){SB=!SB;render()}else if(a==="close")closeM();
else if(a==="add")goalForm(null,b.dataset.y);else if(a==="edit")goalForm(id);else if(a==="view")viewGoal(id);
else if(a==="prog"&&g)openM(`<h3>UPDATE PROGRESS</h3><form data-f=prog data-id=${id}><input type=range name=p min=0 max=100 value=${g.progress} oninput="this.nextElementSibling.textContent=this.value+'%'"><b>${g.progress}%</b><div class=btns><button class=pri>SAVE</button><button type=button data-a=close>CANCEL</button></div></form>`);
else if(a==="done"&&g)ask(`Mark “${g.title}” as completed?`,()=>{Object.assign(g,{status:"Completed",progress:100,completed:today()});upd(g);fx();toast("🏆 Goal completed!")});
else if(a==="del"&&g)ask(`Permanently delete “${g.title}”?`,()=>{S.goals=G().filter(x=>x!==g);save();render();toast("Goal deleted")},"DELETE");
else if(a==="yes"){const f=pend;pend=null;closeM();f&&f()}
else if(a==="yp"){const y=+b.dataset.y,m=ym(y);openM(`<form data-f=yp data-y=${y}><h2>${y} PLAN</h2><label>Theme<input name=theme value="${esc(m.theme)}"></label><label>Priority${sel("prio",["Low","Medium","High","Critical"],m.prio)}</label><label>Target date<input type=date name=target value="${m.target}"></label><label>Notes<textarea name=notes rows=3>${esc(m.notes)}</textarea></label><div class=btns><button class=pri>SAVE</button><button type=button data-a=close>CANCEL</button></div></form>`)}
else if(a==="msadd"){const v=$("#nm").value.trim(),x=gg();if(!v)return toast("Enter a milestone title");x.ms.push({t:v,d:false,n:""});upd(x);viewGoal(cur)}
else if(a.startsWith("ms")){const x=gg(),m=x.ms[i];if(a==="mstog"){m.d=!m.d}else if(a==="msup"&&i>0)x.ms.splice(i-1,0,x.ms.splice(i,1)[0]);else if(a==="msdn"&&i<x.ms.length-1)x.ms.splice(i+1,0,x.ms.splice(i,1)[0]);else if(a==="msdel")x.ms.splice(i,1);else if(a==="msed"){const v=prompt("Milestone title",m.t);if(v&&v.trim())m.t=v.trim()}else if(a==="msnt"){const v=prompt("Milestone note",m.n);if(v!==null)m.n=v}upd(x);viewGoal(cur)}
else if(a==="fadd")finForm();else if(a==="fedit")finForm(id);
else if(a==="ftx")openM(`<form data-f=tx data-id=${id}><h3>ADD TRANSACTION</h3><div id=err class=err></div><label>Date<input type=date name=date value="${today()}"></label><label>Amount (negative = withdrawal)<input type=number name=amt step=any></label><label>Note<input name=note></label><div class=btns><button class=pri>SAVE</button><button type=button data-a=close>CANCEL</button></div></form>`);
else if(a==="fdone"){const f=S.fin.find(x=>x.id===id);ask(`Confirm you have truly achieved “${f.title}”?`,()=>{f.done=today();save();render();fx()})}
else if(a==="fdel"){const f=S.fin.find(x=>x.id===id);ask(`Delete “${f.title}”?`,()=>{S.fin=S.fin.filter(x=>x!==f);save();render()},"DELETE")}
else if(a==="radd")revForm(null,b.dataset.k);else if(a==="redit")revForm(id);
else if(a==="rdel")ask("Delete this review?",()=>{S.reviews=S.reviews.filter(x=>x.id!==id);save();render()},"DELETE");
else if(a==="cadd"||a==="cedit"){const c=S.cats.find(x=>x.id===id)||{name:"",icon:"⭐",color:"#22d3ee"};openM(`<form data-f=cat data-id="${id||""}"><h3>CATEGORY</h3><label>Name<input name=name value="${esc(c.name)}"></label><div class=g2><label>Icon (emoji)<input name=icon value="${esc(c.icon)}" maxlength=4></label><label>Color<input type=color name=color value="${c.color}"></label></div><div class=btns><button class=pri>SAVE</button><button type=button data-a=close>CANCEL</button></div></form>`)}
else if(a==="cdel"){if(S.cats.length<2)return toast("Keep at least one category");ask("Delete this category? Its goals move to another category.",()=>{S.cats=S.cats.filter(x=>x.id!==id);G().forEach(x=>{if(x.cat===id)x.cat=S.cats[0].id});save();render()},"DELETE")}
else if(a==="ejson")dl("project-2036-backup-"+today()+".json",JSON.stringify(S,null,2),"application/json");
else if(a==="ecsv"){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;dl("goals-"+today()+".csv",["Title,Description,Category,Year,Start,Target,Priority,Status,Progress,Budget,Spent,Milestones done,Milestones total,Notes,Created,Updated,Completed",...G().map(g=>[g.title,g.desc,cat(g.cat).name,g.year,g.start,g.target,g.priority,g.status,g.progress,g.budget,g.spent,msd(g),g.ms.length,g.notes,g.created,g.updated,g.completed].map(q).join(","))].join("\n"),"text/csv")}
else if(a==="imp")$("#fi").click();
else if(a==="clear")ask("Clear ALL data? This cannot be undone.",()=>{if(prompt("Type DELETE to confirm")==="DELETE"){S=def();save();render();toast("All data cleared")}},"CONTINUE")});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f)),id=f.dataset.id,er=m=>{$("#err").innerHTML=m};
if(k==="goal"){const p=+d.progress,x=[];if(!d.title.trim())x.push("Title is required.");if(!(p>=0&&p<=100))x.push("Progress must be between 0 and 100.");if(d.target&&d.start&&d.target<d.start)x.push("Target date cannot be before the start date.");if(x.length)return er(x.join("<br>"));
let g=G().find(z=>z.id===id);const was=g&&g.status;if(!g){g={id:uid(),ms:[],created:today()};S.goals.push(g)}
Object.assign(g,{title:d.title.trim(),desc:d.desc,cat:d.cat,year:+d.year,start:d.start,target:d.target,priority:d.priority,status:d.status,progress:p,budget:d.budget,spent:d.spent,notes:d.notes});
if(g.status==="Completed"){g.progress=100;g.completed=g.completed||today();if(was!=="Completed")fx()}else delete g.completed;
upd(g);closeM();toast("Goal saved")}
else if(k==="prog"){const g=G().find(z=>z.id===id);g.progress=+d.p;if(g.progress<100&&g.status==="Completed"){g.status="In Progress";delete g.completed}else if(g.progress>0&&g.status==="Not Started")g.status="In Progress";upd(g);closeM();toast("Progress updated")}
else if(k==="yp"){S.ym[f.dataset.y]={theme:d.theme||"Your Theme",prio:d.prio,target:d.target,notes:d.notes};save();closeM();render();toast("Year updated")}
else if(k==="fin"){if(!d.title.trim()||!(+d.target>0))return er("Title and a target amount above 0 are required.");let o=S.fin.find(z=>z.id===id);if(!o){o={id:uid(),tx:[]};S.fin.push(o)}Object.assign(o,{title:d.title.trim(),target:+d.target,base:+d.base||0,cur:d.cur,year:+d.year,notes:d.notes});save();closeM();render();toast("Saved")}
else if(k==="tx"){if(!+d.amt)return er("Enter a non-zero amount.");S.fin.find(z=>z.id===id).tx.push({date:d.date,amt:+d.amt,note:d.note});save();closeM();render();toast("Transaction added")}
else if(k==="rev"){let r=S.reviews.find(z=>z.id===id);if(!r){r={id:uid()};S.reviews.push(r)}Object.assign(r,d);save();closeM();render();toast("Review saved")}
else if(k==="cat"){if(!d.name.trim())return toast("Name required");let c=S.cats.find(z=>z.id===id);if(!c){c={id:uid()};S.cats.push(c)}Object.assign(c,{name:d.name.trim(),icon:d.icon||"⭐",color:d.color});save();closeM();render()}
else if(k==="set"){const a=+d.sy,b=+d.ey;if(!(a>=1990&&b>a&&b-a<=40))return er("End year must be after start year (max 40 years).");Object.assign(S,{title:d.title.trim()||"PROJECT 2036",vision:d.vision,theme:d.theme,cur:d.cur,sy:a,ey:b});save();render();toast("Settings saved")}});
document.addEventListener("input",e=>{const k=e.target.dataset.fl;if(!k)return;F[k]=e.target.value;if(k==="q"||!$("#gl"))$("#gl").innerHTML=goalList();else $("#gl").innerHTML=goalList()});
document.addEventListener("change",e=>{if(e.target.id!=="fi")return;const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.goals))throw 0;ask("Replace all current data with this backup?",()=>{S={...def(),...j};save();render();toast("Backup imported")},"IMPORT")}catch(x){toast("Invalid backup file")}};r.readAsText(fl);e.target.value=""});
document.addEventListener("toggle",e=>{const d=e.target;if(d.tagName==="DETAILS"){d.open?OP.add(+d.dataset.y):OP.delete(+d.dataset.y)}},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM();if(e.key==="n"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&$("#m").hidden){e.preventDefault();goalForm()}});
$("#m").addEventListener("click",e=>{if(e.target.id==="m")closeM()});
/* particles */
(function(){const c=$("#pc"),x=c.getContext("2d");let w,h,p=[];const r=()=>{w=c.width=innerWidth;h=c.height=innerHeight};r();addEventListener("resize",r);for(let i=0;i<45;i++)p.push({x:Math.random()*w,y:Math.random()*h,v:.15+Math.random()*.4,s:1+Math.random()*1.5});
(function f(){x.clearRect(0,0,w,h);x.fillStyle="rgba(34,211,238,.5)";p.forEach(a=>{a.y-=a.v;if(a.y<0){a.y=h;a.x=Math.random()*w}x.beginPath();x.arc(a.x,a.y,a.s,0,7);x.fill()});requestAnimationFrame(f)})()})();
render();
</script></body></html>
